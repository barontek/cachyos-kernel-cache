name: Kernel

# Builds a CachyOS kernel revision from the recipe in this repo and pushes it
# to the personal Cachix cache, so nixos-rebuild substitutes the kernel instead
# of compiling it locally (3-5 h on a laptop). On success it relocks
# barontek/nixos-config to this revision, so the config only ever points at
# revisions whose kernel is already cached.
#
# Requires the repository secrets CACHIX_AUTH_TOKEN (write access to the cache),
# CACHIX_SIGNING_KEY (cache signing key) and CONFIG_DEPLOY_KEY (write-enabled
# deploy key on barontek/nixos-config). See README.md.

on:
  workflow_dispatch:
    inputs:
      rev:
        description: Recipe revision to build (commit hash in this repo)
        required: true
      variant:
        description: Kernel attribute from legacyPackages
        required: true
        default: linux-cachyos-latest-x86_64-v3

permissions:
  contents: read

env:
  CACHE_NAME: barontek

concurrency:
  group: kernel-cache
  cancel-in-progress: false

jobs:
  build:
    name: Build and push kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: barontek
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}

      - name: Build and push
        run: |
          set -eo pipefail

          kernel="github:barontek/cachyos-kernel-cache/${{ inputs.rev }}#legacyPackages.x86_64-linux.${{ inputs.variant }}"

          # shellcheck disable=SC2016 # Nix expression, not shell interpolation
          if ! raw=$(nix eval --raw --apply 'k: builtins.concatStringsSep "\n" (map (o: k.${o}) k.outputs)' "$kernel"); then
            echo "error: failed to evaluate the kernel outputs" >&2
            exit 1
          fi
          mapfile -t outputs <<< "$raw"
          if [ "${#outputs[@]}" -eq 0 ]; then
            echo "error: kernel evaluation returned no outputs" >&2
            exit 1
          fi
          echo "kernel outputs:"
          printf '  %s\n' "${outputs[@]}"

          cached=true
          for path in "${outputs[@]}"; do
            h=${path##*/}
            h=${h%%-*}
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://$CACHE_NAME.cachix.org/$h.narinfo" || true)
            if [ "$code" != "200" ]; then
              cached=false
            fi
          done
          if [ "$cached" = true ]; then
            echo "all kernel outputs are already cached, nothing to do"
            exit 0
          fi

          nix build --no-link --print-out-paths "$kernel^*" | tee "$RUNNER_TEMP/paths.txt"

          mapfile -t paths < "$RUNNER_TEMP/paths.txt"
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "error: build produced no paths" >&2
            exit 1
          fi

          # linux-config-* is a reference of the kernel dev output, needed when
          # building out-of-tree kernel modules (NVIDIA, Tuxedo) against this
          # kernel, and is not available from cache.nixos.org.
          # shellcheck disable=SC2016 # Nix expression, not shell interpolation
          dev=$(nix eval --raw --apply 'k: k.dev' "$kernel")
          mapfile -t extra < <(nix-store -q --references "$dev" | grep -- '-linux-config-' || true)

          cachix push "$CACHE_NAME" "${paths[@]}" "${extra[@]}"

      - name: Relock nixos-config to this revision
        env:
          DEPLOY_KEY: ${{ secrets.CONFIG_DEPLOY_KEY }}
          BUILT_REV: ${{ inputs.rev }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/relock_key
          chmod 600 ~/.ssh/relock_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/relock_key -o IdentitiesOnly=yes -o BatchMode=yes"

          git clone --quiet git@github.com:barontek/nixos-config.git config
          cd config
          nix flake update nix-cachyos-kernel

          rev=$(sed -n '/"nix-cachyos-kernel"/,$p' flake.lock | grep -m1 '"rev"' | cut -d'"' -f4)
          if [ "$rev" != "$BUILT_REV" ]; then
            echo "recipe HEAD moved past the built revision (built $BUILT_REV, HEAD $rev); skipping relock"
            exit 0
          fi
          if git diff --quiet flake.lock; then
            echo "config is already pinned to $BUILT_REV"
            exit 0
          fi
          changed=$(git diff --name-only | tr '\n' ' ')
          if [ "$changed" != "flake.lock " ]; then
            echo "error: unexpected changes in the config clone: $changed" >&2
            exit 1
          fi

          git config user.name "cachyos-kernel-cache"
          git config user.email "cachyos-kernel-cache@users.noreply.github.com"
          git add flake.lock
          git commit -m "auto update kernel pin"
          git push origin master
          echo "nixos-config is now pinned to $BUILT_REV"

      - name: Purge old kernel paths
        # Cleaning the cache is best-effort: the kernel has already been pushed
        # and the config relocked, so a cleanup failure must not mark the build
        # as failed.
        continue-on-error: true
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          args=(--apply --keep-rev "${{ inputs.rev }}")

          # Keep whichever revision nixos-config actually has committed.  If
          # relocking was skipped, flake.lock in the clone was updated in
          # memory but not pushed, so HEAD still has the old (still needed)
          # revision.
          if [ -d config/.git ]; then
            pinned=$(git -C config show HEAD:flake.lock \
              | sed -n '/"nix-cachyos-kernel"/,$p' \
              | grep -m1 '"rev"' | cut -d'"' -f4)
            if [ -n "$pinned" ]; then
              args+=(--keep-rev "$pinned")
            fi
          fi

          nix run .#purge-cache -- "${args[@]}"
